<form action="action_page.php">
    <div class="container">
      <h1>Login</h1>
      <p>Create an account here.</p>
      <hr>
  
      <label for="email"><b>Email</b></label>
      <input type="text" placeholder="Enter Email" name="email" id="email" required>


  
      <label for="pswrd"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="pswrd" id="pswrd" required>


      <!-- An element to toggle between password visibility -->
      <input type="checkbox" onclick="pswVisability()">Show Password >


  
      <label for="pswrd-repeat"><b>Repeat Password</b></label>
      <input type="password" placeholder="Repeat Password" name="pswrd-repeat" id="pswrd-repeat" required>


      <hr>
  
      <p>By registering you agree to our terms and policy's<a href=""> Terms & Privacy</a>.</p>
      <button type="submit" class="regbtn">Register</button>
    </div>
  
    <div class="container signin">
      <p>Already have an account? <a href="login.html">Log In</a>.</p>
    </div>
  </form>



  <script>
    function pswVisability() {
  var x = document.getElementById("pswrd");
  if (x.type === "password") {
    x.type = "text";
  } else {
    x.type = "password";
  }
}







  </script>
